name: Publish updated index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download updated page from release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download tmp-index-upload \
            --repo manar-photos/manar-photos.github.io \
            --pattern 'space.html' --dir /tmp/site --clobber
          cp /tmp/site/space.html index.html
          ls -la index.html

      - name: Commit and push index.html
        run: |
          git config user.name "manar-photos"
          git config user.email "manar-photos@users.noreply.github.com"
          git add index.html
          git commit -m "Replace index.html with updated bilingual 28-photo gallery" || echo "nothing to commit"
          git push origin HEAD:main
